<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1218" width="960" height="1218" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">One module build, two loops: DV and triage, and local coverage closure</title>
<desc id="desc">build module runs the module graph on its own checkpointed thread. Fixed during the build: the spec, contracts, SystemC model, FRD targets and acceptance tests. Changed by workers: the RTL, supplemental tests and a worker's own testbench. Loop 1, DV and triage: implement (a worker writes the RTL), then verify (lint, assertions, DV, synthesis, timing, targets). When every gate passes the build publishes. On a failure, triage (diagnose, then decide) makes a repair plan: an RTL fix re-enters implement as a new attempt; a testbench fix or a tool re-run goes straight back to verify. Loop 2, coverage, runs inside DV: when the fixed acceptance tests pass but line coverage is below the floor, one helper call adds supplemental tests and the simulation re-runs, up to two local retries; a failing acceptance test or coverage that does not converge goes to triage. The build completes when DV passes, coverage meets the floor, synthesis and timing pass and every required target is measured and met; block_done publishes. It parks when a target cannot be measured, an acceptance test is blamed or a decision is needed, and waits for the Architect's build resume. It fails when repair attempts are exhausted. A measured target miss goes back to the RTL worker with its gap as a repair attempt. Required FRD bounds are checked before publication.</desc>
