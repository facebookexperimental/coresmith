<title id="title">Conversation, commands, evidence: an illustrative CoreSmith session in section</title>
<desc id="desc">Excerpt of an illustrative session; interfaces, the SystemC model, the HDL target and the AREA-CPU-1 row already exist. Time runs down the page. Columns: the conversation between the human and the Architect, an LLM agent; the CoreSmith CLI, which validates, binds and stages; the record, the project database; and the engine, coresmithd running LangGraph with workers that implement RTL. The human asks for a CPU block at or under 1.25 cycles per op within 250,000 square microns. The Architect edits the uArch spec, the SystemC model and the acceptance test, then calls the CLI: frd add PERF-CPU-1 with its bound (recorded); frd verifier binding PERF-CPU-1 to the cocotb test test_throughput (recorded); stage next, refused with FRD_TARGET_UNBOUND for AREA-CPU-1, the stage held and its blockers recorded; frd verifier binding AREA-CPU-1 to the eda area measurement (recorded); stage next, uarch done, now blocks; build targets cpu, which reads the required targets PERF-CPU-1 and AREA-CPU-1; build module cpu, which records the build with its inputs and targets and dispatches a graph thread, returning a build id at once. In the engine: attempt 1, a worker writes the RTL; lint and assertions pass; DV fails on test_irq; triage (diagnose, then decide) chooses an RTL repair, looping back; attempt 2, the worker repairs the RTL; DV passes but coverage is below the floor; supplemental tests are added and the simulation re-runs until covered, a local loop; synthesis and timing pass; the targets are measured and met; block_done publishes and records the pass. build status reads engine state while it runs; build show reads the record: completed at attempt 2, PERF-CPU-1 1.18 of at most 1.25 cycles per op met, AREA-CPU-1 212,140 of at most 250,000 square microns met. The Architect reports back.</desc>
