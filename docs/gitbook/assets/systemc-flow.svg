<text x="96" y="1620" class="k" style="fill:#BC3F2A" text-anchor="middle">SYSTEMC</text>
<line x1="259.5" y1="1615" x2="870" y2="1615" stroke="#2A4BA8" stroke-width="1" stroke-linecap="butt"/>
<line x1="259.5" y1="1615" x2="259.5" y2="1623" stroke="#2A4BA8" stroke-width="1" stroke-linecap="butt"/>
