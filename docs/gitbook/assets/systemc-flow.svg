<text x="40" y="58" class="k">CORESMITH  ·  PLATE 2</text>
<text x="40" y="108" class="s ink" style="font-size:38px">SystemC, the executable reference</text>
<text x="40" y="146" class="s gr" style="font-size:19px">Required at uarch for every authored module; generated primitives are exempt.</text>
<text x="40" y="171" class="s gr" style="font-size:19px">The Architect writes the model and its checks; module builds receive them fixed.</text>
