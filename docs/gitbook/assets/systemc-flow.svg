<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1951" width="960" height="1951" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">SystemC, the executable reference: three representations, readiness, and what a check settles</title>
<desc id="desc">SystemC is required at the uarch stage for every authored module; generated primitives are exempt. Part I aligns one module, cpu, in three planes: specification (interface contracts, the uArch spec, FRD requirements), SystemC reference (model/cpu_model.h generated from the contracts, model/cpu_model.cpp written by the Architect or requested with model author, and the harness model/frd_eval/frd_eval.cpp), and RTL implementation by a worker (targets/cpu.json, rtl/cpu.v written by a worker, and the Architect's fixed acceptance test tb/cocotb/test_cpu.py). The model crosses into the implementation only as a fixed input of the module build with its recorded identity. PERF-CPU-1 declares a model check, so model eval judges it on the model (model_eval, rank 1) and the acceptance test on the RTL (block_dv, rank 2). AREA-CPU-1 declares none, so it passes the model untouched and is measured by synthesis. No automatic equivalence check crosses the seam. Part II: the module is ready only when the model exists, compiles and smoke-runs, is built at current bytes, headers and contract, and each declared check has a current passing verdict; otherwise MODEL_MISSING, MODEL_NOT_BUILT, MODEL_STALE, MODEL_CHECK_MISSING, MODEL_CHECK_FAILED or MODEL_CHECK_STALE. Part III: check ranks model_eval 1, block_dv 2, integration_dv 3, validation_dv and acceptance 4, signoff 5; an item's status is its latest check of the highest rank present.</desc>
