<text x="579.75" y="1620" class="k" style="fill:#2A4BA8" text-anchor="middle">RTL</text>
<text x="40" y="1782" class="s ink" style="font-size:18px">A model pass never overrides an RTL fail.</text>
<text x="40" y="1807" class="s ink" style="font-size:18px">A failed declared model check blocks readiness even after an RTL pass.</text>
<line x1="40" y1="1844" x2="920" y2="1844" stroke="#CBC6BB" stroke-width="1" stroke-linecap="butt"/>
<text x="40" y="1874" class="s it gr" style="font-size:14.5px">Optional: model … --arch builds an abstract performance model; it does not replace this one.</text>
<text x="40" y="1895" class="s it gr" style="font-size:14.5px">Also required at uarch: a registered spec, a bound target, measurable targets, a worker binding.</text>
<text x="40" y="1916" class="s it gr" style="font-size:14.5px">File names follow the CLI’s conventions; verdicts are examples.</text>
