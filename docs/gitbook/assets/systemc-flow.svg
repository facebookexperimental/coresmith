<text x="483" y="1734" class="s it gr" style="font-size:16px" text-anchor="middle">chip</text>
<line x1="676.5" y1="1668" x2="676.5" y2="1688" stroke="#1B1D21" stroke-width="1.2" stroke-linecap="butt"/>
