<text x="628" y="962" class="k" style="fill:#BC3F2A" text-anchor="middle">SEAM</text>
<text x="40" y="1004" class="s ink sb" style="font-size:18px">No automatic equivalence check crosses the seam.</text>
<text x="40" y="1029" class="s gr" style="font-size:18px">An acceptance test compares only what it is written to compare.</text>
<line x1="40" y1="1074" x2="920" y2="1074" stroke="#CBC6BB" stroke-width="1" stroke-linecap="butt"/>
<text x="40" y="1114" class="s" style="font-size:24px"><tspan class="gr it">II   </tspan><tspan class="ink">Readiness</tspan></text>
<text x="40" y="1140" class="s it gr" style="font-size:16px">stage next and build module refuse the module until every line holds.</text>
<text x="40" y="1186" class="k">READY WHEN</text>
<text x="920" y="1186" class="k" text-anchor="end">ELSE REFUSED</text>
<line x1="40" y1="1210" x2="920" y2="1210" stroke="#E7E2D7" stroke-width="1" stroke-linecap="butt"/>
<text x="40" y="1236" class="f gr" style="font-size:16px">1</text>
<text x="68" y="1236" class="s ink" style="font-size:18px">the model exists</text>
<text x="920" y="1236" class="m gr" style="font-size:16px" text-anchor="end">MODEL_MISSING</text>
<line x1="40" y1="1248" x2="920" y2="1248" stroke="#E7E2D7" stroke-width="1" stroke-linecap="butt"/>
<text x="40" y="1274" class="f gr" style="font-size:16px">2</text>
<text x="68" y="1274" class="s ink" style="font-size:18px">it compiles and smoke-runs (model build)</text>
<text x="920" y="1274" class="m gr" style="font-size:16px" text-anchor="end">MODEL_NOT_BUILT</text>
<line x1="40" y1="1286" x2="920" y2="1286" stroke="#E7E2D7" stroke-width="1" stroke-linecap="butt"/>
<text x="40" y="1312" class="f gr" style="font-size:16px">3</text>
<text x="68" y="1312" class="s ink" style="font-size:18px">it is built at current bytes, headers, contract</text>
<text x="920" y="1312" class="m gr" style="font-size:16px" text-anchor="end">MODEL_STALE</text>
<line x1="40" y1="1324" x2="920" y2="1324" stroke="#E7E2D7" stroke-width="1" stroke-linecap="butt"/>
<text x="40" y="1350" class="f gr" style="font-size:16px">4</text>
<text x="68" y="1350" class="s ink" style="font-size:18px">each declared check has a verdict (model eval)</text>
<text x="920" y="1350" class="m gr" style="font-size:16px" text-anchor="end">MODEL_CHECK_MISSING</text>
<line x1="40" y1="1362" x2="920" y2="1362" stroke="#E7E2D7" stroke-width="1" stroke-linecap="butt"/>
<text x="40" y="1388" class="f gr" style="font-size:16px">5</text>
<text x="68" y="1388" class="s ink" style="font-size:18px">every declared check passes</text>
<text x="920" y="1388" class="m gr" style="font-size:16px" text-anchor="end">MODEL_CHECK_FAILED</text>
<line x1="40" y1="1400" x2="920" y2="1400" stroke="#E7E2D7" stroke-width="1" stroke-linecap="butt"/>
<text x="40" y="1426" class="f gr" style="font-size:16px">6</text>
<text x="68" y="1426" class="s ink" style="font-size:18px">verdicts match the model, harness, requirement</text>
<text x="920" y="1426" class="m gr" style="font-size:16px" text-anchor="end">MODEL_CHECK_STALE</text>
<line x1="40" y1="1442" x2="920" y2="1442" stroke="#CBC6BB" stroke-width="1" stroke-linecap="butt"/>
<text x="40" y="1476" class="s it ink" style="font-size:16px">Editing the model re-opens the gate and stales the module’s published build.</text>
<line x1="40" y1="1522" x2="920" y2="1522" stroke="#CBC6BB" stroke-width="1" stroke-linecap="butt"/>
<text x="40" y="1562" class="s" style="font-size:24px"><tspan class="gr it">III   </tspan><tspan class="ink">What a check settles</tspan></text>
<text x="40" y="1588" class="s it gr" style="font-size:16px">An item’s status is its latest check of the highest rank present.</text>
<line x1="96" y1="1678" x2="870" y2="1678" stroke="#1B1D21" stroke-width="1.2" stroke-linecap="butt"/>
