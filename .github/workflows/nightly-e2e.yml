#
# Nightly end-to-end smoke test:
#   1. Build the Dockerfile (catches Yosys / Verilator / OpenROAD / cocotb
#      upstream breakage and Sky130 PDK URL rot)
#   2. Run `make preflight` inside the container to verify the toolchain
#   3. Run `make demo` (the 8-bit adder reference design) end-to-end:
#      RTL gen -> lint -> testbench -> sim -> synthesis
#
# Requires the CLAUDE_CODE_OAUTH_TOKEN repo secret. If it's not configured
# the LLM steps are skipped and only the toolchain build is exercised --
# we still catch most upstream breakage that way.

name: Nightly E2E

on:
  schedule:
    # 07:00 UTC daily -- after most upstream nightlies have published.
    - cron: '0 7 * * *'
  workflow_dispatch:
    # Allow manual runs from the Actions tab for debugging.

jobs:
  docker-build:
    name: Build container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build coresmith image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: coresmith:nightly
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Preflight check inside container
        run: |
          docker run --rm coresmith:nightly bash -lc 'cd /coresmith && make preflight'

  stage-fixtures:
    name: Stage fixtures (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Package C, C6: re-run the T1 stage-fixture gate in STRICT mode so a
    # checkpoint that has drifted out of schema sync (topology/state/langgraph
    # change) hard-fails the nightly instead of silently skipping like it does
    # on PRs. No Docker / EDA / live LLM needed -- pure Python.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node + Claude CLI
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo bash -
          sudo apt-get install -y nodejs
          sudo npm install -g @anthropic-ai/claude-code

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e "orchestrator[dev]"

      - name: Stage-fixture gate (strict -- fail on schema drift)
        env:
          CORESMITH_STAGE_STRICT: "1"
        run: pytest orchestrator/tests/ -v -m stage_fixture

  e2e-demo:
    name: Run make demo on adder8
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 30
    # Skip the LLM-driven leg if the auth secret isn't configured -- avoids
    # noisy red CI on forks that haven't wired up a token.
    if: ${{ github.repository == 'facebookexperimental/coresmith' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore coresmith image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: coresmith:nightly
          load: true
          cache-from: type=gha

      - name: Check secret presence
        id: have_token
        run: |
          if [ -n "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run adder8 canary (headless auto-approver)
        # Package C, C6: drive the smallest real design end-to-end with NO human
        # in the loop -- nightly_canary.py polls `coresmith state` and resumes
        # every interrupt with a safe default action, then snapshots a post-rtl
        # stage fixture. This is the refresh source for the in-repo stage/replay
        # fixtures (the uploaded llm_calls.jsonl + stage snapshot below).
        if: steps.have_token.outputs.present == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          docker run --rm \
              -e CLAUDE_CODE_OAUTH_TOKEN \
              -e CORESMITH_MODEL=sonnet-5 \
              -e CORESMITH_PROFILE=strict \
              -v "${{ github.workspace }}/.coresmith:/coresmith/.coresmith" \
              coresmith:nightly bash -lc 'cd /coresmith && \
                python3 scripts/nightly_canary.py \
                  --project-root /coresmith \
                  --blocks-file examples/adder8/blocks.yaml \
                  --timeout-s 1500'

      - name: Skip note (no token)
        if: steps.have_token.outputs.present != 'true'
        run: |
          echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not configured; skipping LLM-driven demo leg."
          echo "The Docker build + preflight check still ran in the docker-build job."

      - name: Upload pipeline artifacts
        if: always() && steps.have_token.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results-${{ github.run_id }}
          path: |
            .coresmith/pipeline_results.json
            .coresmith/pipeline_events.jsonl
            .coresmith/llm_calls.jsonl
            .coresmith/traces.db
            .coresmith/stage_snapshot_post_rtl/
            rtl/adder8/
            syn/output/adder8/
          if-no-files-found: ignore
          retention-days: 14
