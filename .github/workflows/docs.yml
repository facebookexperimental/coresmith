name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/gitbook/**"
      - "mkdocs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build book
        run: |
          pip install "mkdocs==1.6.1" "mkdocs-material==9.7.7"
          mkdocs build --strict -f mkdocs-site/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mkdocs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
