<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surfer (self-hosted) · waveform eval</title>
<link rel="stylesheet" href="./_demo_common.css">
</head>
<body>
  <div class="demo-header">
    <a href="./">← back</a>
    <span class="demo-title">Surfer</span>
    <span class="demo-tag">self-hosted</span>
    <span>./surfer-local/ · Rust→WASM · ~14 MB</span>
    <span id="status" class="demo-status">loading…</span>
  </div>
  <iframe
    id="surfer"
    class="demo-frame"
    src="./surfer-local/index.html"
    allow="cross-origin-isolated; clipboard-write"
  ></iframe>
  <script>
    const VCD = location.origin + "/api/artifacts/sim_build/adder32/dump.vcd";
    const iframe = document.getElementById("surfer");
    const status = document.getElementById("status");
    iframe.addEventListener("load", () => {
      status.textContent = "LoadUrl posted → " + VCD;
      status.classList.add("ok");
      setTimeout(() => {
        try {
          iframe.contentWindow.postMessage({ command: "LoadUrl", url: VCD }, "*");
        } catch (e) {
          status.textContent = "postMessage failed: " + e.message;
          status.classList.remove("ok");
          status.classList.add("err");
        }
      }, 1500);
    });
  </script>
</body>
</html>
