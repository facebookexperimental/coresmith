site_name: CoreSmith
site_description: Architect, CLI, module builds, and evidence
site_url: https://facebookexperimental.github.io/coresmith/
use_directory_urls: false

docs_dir: ../docs/gitbook
exclude_docs: |
  SUMMARY.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/plates.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys

nav:
  - CoreSmith: README.md
  - Workflow: pipeline-overview.md
  - Architecture: architecture-phase.md
  - SystemC: systemc.md
  - Module builds: frontend-rtl-pipeline.md
  - Targets and build outcomes: targets-and-experiments.md
  - Agents and models: agents-and-models.md
  - Integration and backend: backend-and-tapeout.md
  - Evidence and trajectories: state-artifacts-observability.md
  - CLI and operation: usage.md
